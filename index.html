<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr. Paul's Classroom</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf8ef; --ink:#24292f; --soft:#57606a; --blue:#1f6feb; --blue-d:#1a5fd0; --orange:#f0a020;
  --green:#2da44e; --red:#e5534b; --purple:#8250df; --yellow:#ffd33d; --card:#ffffff; --line:#e7dfd0;
  --bezel:#33475b; --radius:20px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 28px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{font-weight:900;font-size:clamp(22px,3vw,30px);letter-spacing:-.3px}
.brand span{color:var(--blue)}
.levels{display:flex;background:#efe6d6;border-radius:999px;padding:5px;gap:4px}
.levels button{border:0;background:transparent;padding:10px 18px;border-radius:999px;font-weight:800;font-size:16px;color:var(--soft)}
.levels button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.levels small{display:block;font-size:12px;font-weight:700;opacity:.75}
.top-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.voices button{padding:10px 14px;font-size:15px}

/* ask bar */
.ask{background:var(--card);border-radius:var(--radius);padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 16px rgba(80,60,20,.08)}
.mic{flex:none;width:72px;height:72px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:32px;box-shadow:0 4px 0 #b83c35;transition:transform .1s}
.mic:active{transform:translateY(3px);box-shadow:0 1px 0 #b83c35}
.mic.listening{animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,83,75,.55)}100%{box-shadow:0 0 0 22px rgba(229,83,75,0)}}
.field{flex:1;min-width:0}
.field input{width:100%;border:3px solid var(--line);border-radius:14px;padding:14px 16px;font-size:20px;font-family:inherit;font-weight:700;color:var(--ink);outline:none}
.field input:focus{border-color:var(--blue)}
.hint{font-size:14px;color:var(--soft);margin-top:6px;font-weight:700;min-height:19px}
.go{flex:none;border:0;background:var(--blue);color:#fff;font-weight:900;font-size:20px;padding:0 26px;height:60px;border-radius:16px;box-shadow:0 4px 0 #154aa8}
.go:disabled{opacity:.5}
.go.ready{animation:glow 1s infinite alternate}
@keyframes glow{to{background:#4b8df5}}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 2px 16px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px;color:var(--ink)}
.chip:hover{border-color:var(--blue);color:var(--blue)}

/* classroom */
.room{display:grid;grid-template-columns:1.65fr 1fr;gap:16px;align-items:start}
.board-wrap{background:var(--bezel);border-radius:24px;padding:14px 14px 10px;box-shadow:0 8px 24px rgba(30,40,60,.25)}
.board{position:relative;background:#fff;border-radius:12px;overflow:hidden;aspect-ratio:8/5}
.board svg{width:100%;height:100%;display:block}
.board svg text{cursor:pointer}
.board svg text:hover{opacity:.7}
.thinking{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(255,255,255,.92);font-family:'Patrick Hand',cursive;font-size:clamp(24px,3.4vw,38px);color:var(--blue)}
.thinking.on{display:flex}
.dots span{display:inline-block;width:14px;height:14px;margin:0 5px;border-radius:50%;background:var(--orange);animation:bob .9s infinite}
.dots span:nth-child(2){animation-delay:.15s;background:var(--green)}.dots span:nth-child(3){animation-delay:.3s;background:var(--purple)}
@keyframes bob{50%{transform:translateY(-12px)}}
.tray{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px 2px;color:#fff}
.caption{font-family:'Patrick Hand',cursive;font-size:clamp(18px,2.2vw,24px);flex:1;min-width:0}
.ctrls{display:flex;gap:6px}
.ctrls button{border:0;background:rgba(255,255,255,.16);color:#fff;font-size:18px;font-weight:900;width:44px;height:40px;border-radius:10px}
.ctrls button:hover{background:rgba(255,255,255,.3)}
.ctrls button:disabled{opacity:.35}

.panel{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 4px 16px rgba(80,60,20,.08)}
.panel h2{margin:0 0 10px;font-size:clamp(22px,2.6vw,28px);font-weight:900;line-height:1.15}
.read p{font-size:clamp(19px,2vw,22px);line-height:1.55;margin:0 0 12px;font-weight:700}
.read .w{border-radius:6px;padding:0 2px;transition:background .12s,color .12s}
.read .w.done{color:var(--ink)}
.read .w.on{background:var(--yellow);color:#000}
.read.speaking .w:not(.done):not(.on){color:#9aa3ad}
.playrow{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:900;font-size:16px;background:#eef3fb;color:var(--blue-d)}
.btn:hover{background:#dde8fa}
.vocab{margin-top:14px;border-top:2px dashed var(--line);padding-top:12px}
.vocab div{margin:6px 0;font-size:17px;font-weight:700}
.vocab b{color:var(--purple)}

.extras{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px;margin-top:16px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 4px 16px rgba(80,60,20,.08)}
.card h3{margin:0 0 8px;font-size:19px;font-weight:900}
.card p{margin:0;font-size:17px;line-height:1.5;font-weight:700}
.img-card img{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:#f4efe6;display:block}
.credit{font-size:12.5px !important;color:var(--soft);margin-top:8px !important;font-weight:700 !important}
.wow{background:#fff7d6}.wow h3{color:#b07800}
.tryit{background:#e8f6ec}.tryit h3{color:var(--green)}

.quiz{margin-top:16px}
.quiz .q{font-size:clamp(20px,2.2vw,24px);font-weight:900;margin-bottom:12px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{border:3px solid var(--line);background:#fff;border-radius:16px;padding:16px 12px;font-weight:800;font-size:18px;color:var(--ink);min-height:64px}
.opt:hover{border-color:var(--blue)}
.opt.right{border-color:var(--green);background:#e8f6ec}
.opt.wrong{border-color:var(--red);background:#fdeceb;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{margin-top:12px;font-size:18px;font-weight:800;min-height:24px}

.deeper{margin-top:16px}
.deeper .row{display:flex;flex-wrap:wrap;gap:10px}
.big-btns{display:flex;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.bigbtn{border:0;border-radius:16px;padding:16px 22px;font-weight:900;font-size:19px;color:#fff;flex:1;min-width:200px}
.bigbtn.ask-about{background:var(--red);box-shadow:0 4px 0 #b83c35}
.bigbtn.more{background:var(--green);box-shadow:0 4px 0 #1f7a38}
.bigbtn:active{transform:translateY(3px)}
.deeper .sub{font-size:15px;font-weight:800;color:var(--soft);margin-bottom:8px}
.deeper .chip{font-size:16px;padding:10px 16px;background:#f3eefe;border-color:#e2d6fb;color:#5b3ab0}

.notice{margin-top:18px;font-size:13.5px;color:var(--soft);line-height:1.5;text-align:center;font-weight:700}
.hide{display:none !important}

@media (max-width:900px){
  .room{grid-template-columns:1fr}
  .extras{grid-template-columns:1fr}
}
@media (max-width:560px){
  .ask{flex-wrap:wrap}
  .mic{width:60px;height:60px;font-size:26px}
  .go{width:100%;height:54px}
  .opts{grid-template-columns:1fr}
  .levels button{padding:8px 12px;font-size:14px}
}
.small-btn{border:0;background:#efe6d6;border-radius:999px;padding:10px 14px;font-weight:800;font-size:15px;color:var(--ink)}
.small-btn:hover{background:#e6dac4}
.small-btn.on{background:var(--ink);color:#fff}
.lang button{padding:10px 12px;font-size:15px}
.thumbs{display:flex;align-items:center;gap:6px;margin-left:auto;font-weight:800;font-size:14px;color:var(--soft)}
.thumbs button{border:0;background:#f3efe6;border-radius:10px;padding:8px 10px;font-size:18px}
.thumbs button:hover{background:#e9e2d2}
.print-only{display:none}
.legend{margin:8px 4px 2px;padding:10px 6px 2px;border-top:2px dashed rgba(255,255,255,.3);display:flex;flex-wrap:wrap;gap:8px;color:#fff}
.legend .lt{width:100%;font-size:13px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;color:#cfe0ff}
.legend button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:16px}
.legend button:hover{background:rgba(255,255,255,.26)}
.legend b{font-family:'Patrick Hand',cursive;font-size:22px;color:#ffd33d;margin-right:6px}
.legend .fxb{width:100%;text-align:left;border-radius:14px;line-height:1.4}

/* Classroom mode: big board for a whole class */
body.present .wrap{max-width:none;padding:12px 24px}
body.present .starters,body.present .notice{display:none}
body.present .room{grid-template-columns:2.4fr 1fr}
body.present .read p{font-size:clamp(22px,1.8vw,30px)}
body.present .panel h2{font-size:clamp(26px,2.4vw,36px)}
body.present .caption{font-size:clamp(22px,2vw,30px)}
@media (max-width:900px){ body.present .room{grid-template-columns:1fr} }

/* Printable recap */
@media print{
  @page{margin:14mm}
  body{background:#fff}
  .ask,.starters,.ctrls,.playrow,.deeper,.notice,.top-right,.thinking,.feedback,#vocabSpacer{display:none !important}
  .wrap{max-width:none;padding:0}
  .room{grid-template-columns:1fr}
  .board-wrap{box-shadow:none;background:#fff;border:3px solid #33475b;padding:8px}
  .tray{color:#24292f}
  .legend{color:#24292f;border-top-color:#ccc}
  .legend button{background:#f3efe6;color:#24292f}
  .legend .lt{color:#57606a}
  .panel,.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .extras{grid-template-columns:1fr 1fr}
  .read .w{color:#24292f !important;background:none !important}
  .opt{min-height:auto;padding:8px}
  .print-only{display:block !important}
}
</style>

  const L = t();
  document.documentElement.lang = lang;
  $("brand").innerHTML = L.brand; $("lvLittle").innerHTML = L.little; $("lvBig").innerHTML = L.big;
  $("vMan").textContent = L.man; $("vWoman").textContent = L.woman;
  $("present").textContent = document.body.classList.contains("present") ? L.presentOff : L.present;
  $("q").placeholder = L.placeholder; $("go").textContent = L.ask;
  if (!busy) $("hint").textContent = SR ? L.hint : L.noMic;
  $("again").textContent = L.again; $("stop").textContent = L.stop; $("print").textContent = L.print; $("helpful").textContent = L.helpful;
  $("hImg").textContent = L.hImg; $("hWow").textContent = L.hWow; $("hTry").textContent = L.hTry; $("hQuiz").textContent = L.hQuiz;
  $("hDeep").textContent = L.hDeep; $("askAbout").textContent = L.askAbout; $("tellMore").textContent = L.tellMore; $("orTry").textContent = L.orTry;
  $("notice").textContent = L.notice; $("thinkText").textContent = L.thinking;
  $("lnEn").classList.toggle("on", lang === "en"); $("lnEs").classList.toggle("on", lang === "es");
  if (rec) rec.lang = lang === "es" ? "es-US" : "en-US";

}
function setLang(l){
  lang = l; try { localStorage.setItem("mpc_lang", l); } catch(e) {}
  applyText();
  if (!lesson) { $("title").textContent = t().welcomeTitle; $("read").innerHTML = "<p></p>"; $("read").firstChild.textContent = t().welcomeText; welcome(); }
}
function setLevel(l){

  $("lvLittle").classList.toggle("on", l === "little"); $("lvBig").classList.toggle("on", l === "big");
  renderStarters();
}
function renderStarters(){

  const box = $("starters"); box.innerHTML = "";
  const lab = document.createElement("span");
  lab.textContent = t().tryLabel; lab.style.cssText = "font-weight:900;color:#57606a;align-self:center";
  box.appendChild(lab);
  pool.forEach(q => { const b = document.createElement("button"); b.className = "chip"; b.textContent = q; b.onclick = () => { unlock(); $("q").value = q; ask(); }; box.appendChild(b); });
}
$("lvLittle").onclick = () => setLevel("little");
$("lvBig").onclick = () => setLevel("big");
$("lnEn").onclick = () => setLang("en");

/* ---------- classroom mode ---------- */
function setPresent(on){
  document.body.classList.toggle("present", on);
  $("present").textContent = on ? t().presentOff : t().present;
  $("present").classList.toggle("on", on);
}
$("present").onclick = () => {
  const on = !document.body.classList.contains("present");
  setPresent(on);
  try {
    if (on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
  } catch(e) {}
  if (on) track("classroom_mode", { lang });
};
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("present")) setPresent(false); });

/* ---------- audio unlock (must happen on a tap) ---------- */
function unlock(){
  try { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); } catch(e) {}
  try { if ("speechSynthesis" in window) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } } catch(e) {}
}

/* ---------- microphone (browser speech-to-text, nothing recorded) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
function startListening(){
  if (!rec) { $("q").focus(); return; }
  try { stopVoice(); rec.start(); listening = true; $("mic").classList.add("listening"); $("mic").textContent = "👂"; $("hint").textContent = t().listening; } catch(e) {}
}
if (!SR) {
  // This browser can't turn speech into text, so open the keyboard: every phone keyboard has its own 🎤
  $("mic").onclick = () => { unlock(); $("q").focus(); $("hint").textContent = t().noMic; };
} else {
  rec = new SR(); rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  rec.onresult = e => { let s = ""; for (const r of e.results) s += r[0].transcript; $("q").value = s; };
  rec.onend = () => {
    listening = false; $("mic").classList.remove("listening"); $("mic").textContent = "🎤";
    if ($("q").value.trim()) { $("hint").textContent = t().heard; $("go").classList.add("ready"); }
    else $("hint").textContent = t().nothing;
  };
  rec.onerror = e => { if (e.error === "not-allowed" || e.error === "service-not-allowed") $("hint").textContent = t().micBlocked; };
  $("mic").onclick = () => { unlock(); if (listening) { rec.stop(); return; } $("q").value = ""; $("go").classList.remove("ready"); startListening(); };
}
$("go").onclick = () => { unlock(); ask(); };
$("q").addEventListener("keydown", e => { if (e.key === "Enter") { unlock(); ask(); } });

/* ---------- asking: words and drawing are fetched at the same time ---------- */
const norm = s => s.toLowerCase().replace(/[?!.¿¡,]+/g, " ").replace(/\s+/g, " ").trim();
async function fetchPart(part, question, context, opts){
  let r;
  if (!context && !opts.more) {
    const url = `/api/ask?part=${part}&level=${level}&lang=${lang}&v=3&q=${encodeURIComponent(norm(question))}`;
    r = await fetch(url);
  } else {
    r = await fetch("/api/ask", { method:"POST", headers:{ "content-type":"application/json" },
      body: JSON.stringify({ part, question, level, lang, context: context || "", more: !!opts.more, prev: opts.prev || "" }) });
  }
  const d = await r.json().catch(() => null);
  return { ok: r.ok, status: r.status, d };
}
async function ask(text, context, opts){
  opts = opts || {};
  if (!context && followUp) context = followUp;
  followUp = "";
  const question = (text || $("q").value).trim();
  if (!question || busy) return;
  if (text) $("q").value = text;
  const my = ++reqId;
  busy = true; $("go").disabled = true; $("go").classList.remove("ready");
  stopVoice(); $("thinkText").textContent = t().thinking; $("thinking").classList.add("on");
  $("hint").textContent = t().markers;

  // the drawing starts right away, alongside the words
  const boardP = (async () => {
    for (let a = 0; a < 2; a++) {
      try { const x = await fetchPart("board", question, context, opts); if (x.d && Array.isArray(x.d.steps)) return x.d.steps; } catch(e) {}
    }
    return null;
  })();

  let data = null, reason = "N0";
  for (let attempt = 0; attempt < 2 && !data; attempt++) {
    if (attempt === 1) $("hint").textContent = t().fresh;
    try {
      const x = await fetchPart("lesson", question, context, opts);
      if (x.d && Array.isArray(x.d.answer) && x.d.answer.length) data = x.d;
      else reason = (x.d && x.d.reason) || ("H" + x.status);
    } catch(e) { reason = "N0"; }
  }
  if (my !== reqId) return;
  try {
    if (!data) throw new Error(reason);
    lesson = data; render();
    $("hint").textContent = t().another;
    track("lesson", { topic: String(data.title || "").slice(0, 80), level, lang, type: data.type });
  } catch(e) {
    lesson = null; stopVoice();
    $("title").textContent = t().oops;
    $("read").innerHTML = "<p></p>"; $("read").firstChild.textContent = t().oopsText;
    const code = document.createElement("p"); code.style.cssText = "font-size:12px;color:#9aa3ad;margin:0";
    code.textContent = t().code + (data ? "P8" : e.message); $("read").appendChild(code);
    $("playrow").classList.add("hide"); $("vocab").classList.add("hide"); $("extras").classList.add("hide");
    ["quizCard","deepCard"].forEach(id => $(id).classList.add("hide"));
    $("thinking").classList.remove("on");
    buildBoard([{ caption: t().tapAgain, svg: simpleCard("redirect") }]); revealNext();
    $("hint").textContent = t().tapAgain;
    busy = false; $("go").disabled = false;
    return;
  }
  busy = false; $("go").disabled = false;

  // words are showing; now wait for the drawing
  if (data.type !== "lesson") { $("thinking").classList.remove("on"); return; }
  $("thinkText").textContent = t().drawing;
  const steps = await boardP;
  if (my !== reqId) return;
  $("thinking").classList.remove("on");
  if (steps && steps.length) {
    buildBoard(steps);
    // a late drawing always starts at Step 1 and spreads over the rest of the talking
    if (speaking && lastProgress < 0.85) { boardStart = lastProgress; onProgress(lastProgress); }
    else { manual = true; playSteps(); }
  } else {
    buildBoard([{ caption: t().otherCap, svg: simpleCard("redirect") }]); revealNext();
  }
}

/* ---------- render a lesson ---------- */
function render(){
  const L = lesson, isLesson = L.type === "lesson", S = t();
  $("title").textContent = L.title || "";
  speech = (L.answer || []).join(" ");
  words = []; let offset = 0; const read = $("read"); read.innerHTML = "";
  (L.answer || []).forEach(p => {
    const el = document.createElement("p");
    p.replace(/\S+|\s+/g, (tok, i) => {
      if (/\S/.test(tok)) { const s = document.createElement("span"); s.className = "w"; s.textContent = tok; el.appendChild(s); words.push({ el: s, start: offset + i, t: null }); }
      else el.appendChild(document.createTextNode(tok));
      return tok;
    });
    read.appendChild(el); offset += p.length + 1;
  });
  $("playrow").classList.remove("hide");
  $("thumbs").classList.toggle("hide", !isLesson);
  $("helpful").textContent = S.helpful; $("up").disabled = false; $("down").disabled = false;

  const vb = $("vocab"); vb.innerHTML = "";
  if (isLesson && L.vocab && L.vocab.length) {
    L.vocab.forEach(v => { if (!v.word) return; const d = document.createElement("div"); d.innerHTML = "<b></b> — <span></span>"; d.querySelector("b").textContent = v.word; d.querySelector("span").textContent = v.meaning; vb.appendChild(d); });
    vb.classList.toggle("hide", !vb.children.length);
  } else vb.classList.add("hide");

  if (isLesson) buildBoard([]);
  else buildBoard([{ caption: L.type === "help" ? S.helpCap : S.otherCap, svg: simpleCard(L.type) }]);

  const ex = $("extras"); ex.classList.add("hide");
  ["imgCard","wowCard","tryCard","quizCard","deepCard"].forEach(id => $(id).classList.add("hide"));
  if (isLesson) {
    if (L.wow) { $("wow").textContent = L.wow; $("wowCard").classList.remove("hide"); ex.classList.remove("hide"); }
    if (L.try_it) { $("try").textContent = L.try_it; $("tryCard").classList.remove("hide"); ex.classList.remove("hide"); }
    if (L.image_query) loadImage(L.image_query);
    if (L.quiz && L.quiz.options && L.quiz.options.length) buildQuiz(L.quiz);
    const row = $("deeper"); row.innerHTML = "";
    (L.deeper || []).slice(0, 3).forEach(q => { const b = document.createElement("button"); b.className = "chip"; b.textContent = q; b.onclick = () => { unlock(); ask(q, L.title); window.scrollTo({ top: 0, behavior: "smooth" }); }; row.appendChild(b); });
    $("orTry").classList.toggle("hide", !row.children.length);
    $("tellMore").onclick = () => { unlock(); ask(S.moreQ(L.title), L.title, { more: true, prev: speech }); window.scrollTo({ top: 0, behavior: "smooth" }); };
    $("askAbout").onclick = () => { unlock(); followUp = L.title; $("q").value = ""; window.scrollTo({ top: 0, behavior: "smooth" }); $("hint").textContent = S.askAboutHint(L.title); startListening(); };
    $("deepCard").classList.remove("hide");
  }
  if (!isLesson) { buildBoard([{ caption: L.type === "help" ? S.helpCap : S.otherCap, svg: simpleCard(L.type) }]); revealNext(); }
  speak();
}

function simpleCard(type){

}
function esc(s){ return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/'/g, "&#39;"); }

/* ---------- printable recap ---------- */
$("print").onclick = () => { track("print", { lang }); window.print(); };
window.addEventListener("beforeprint", () => {
  groups.forEach(g => { g.style.display = ""; g.querySelectorAll("*").forEach(el => { el.style.transition = "none"; el.style.strokeDashoffset = 0; el.style.opacity = 1; el.style.fillOpacity = ""; }); });
});
window.addEventListener("afterprint", () => { groups.forEach((g, i) => { g.style.display = i < shown ? "" : "none"; }); });

/* ---------- smart board: safe SVG + live drawing ---------- */
const OK_TAGS = new Set(["g","path","line","circle","ellipse","rect","polyline","polygon","text","tspan"]);
function sanitize(markup){
  const doc = new DOMParser().parseFromString(`<svg xmlns="${NS}">${markup}</svg>`, "image/svg+xml");
  if (doc.querySelector("parsererror")) return null;
  const out = document.createElementNS(NS, "g");
  const copy = (src, dst) => {
    for (const n of src.childNodes) {
      if (n.nodeType === 3) { dst.appendChild(document.createTextNode(n.textContent)); continue; }
      if (n.nodeType !== 1 || !OK_TAGS.has(n.localName)) continue;
      const el = document.createElementNS(NS, n.localName);
      for (const a of n.attributes) {
        const name = a.name.toLowerCase(), val = a.value;
        if (name.startsWith("on") || name.includes("href") || /url\(|javascript:|expression/i.test(val)) continue;
        el.setAttribute(a.name, val);
      }
      copy(n, el); dst.appendChild(el);
    }
  };
  copy(doc.documentElement, out);
  return out;
}
function buildBoard(steps){
  const svg = $("svg"); svg.innerHTML = ""; groups = []; shown = 0; manual = false; boardStart = 0; $("legend").classList.add("hide");
  steps.forEach(s => {
    const g = sanitize(s.svg || "") || document.createElementNS(NS, "g");
    g.style.display = "none"; g.dataset.caption = s.caption || "";
    g._legend = Array.isArray(s.legend) ? s.legend : [];
    g._formulas = Array.isArray(s.formulas) ? s.formulas : [];
    svg.appendChild(g); groups.push(g);
  });
  svg.querySelectorAll("text").forEach(el => el.addEventListener("click", () => { if (!speaking) sayShort(el.textContent); }));
  $("caption").textContent = groups.length > 1 ? t().watch : (steps[0] ? steps[0].caption || "" : "");
  updateCtrls();
}
function drawGroup(g){
  g.style.display = "";
  g.querySelectorAll("path,line,circle,ellipse,rect,polyline,polygon,text").forEach((el, i) => {
    const delay = i * 0.12;
    if (el.tagName === "text" || el.tagName === "tspan") {
      el.style.transition = "none"; el.style.opacity = 0;
      requestAnimationFrame(() => { el.style.transition = `opacity .5s ${delay + .3}s`; el.style.opacity = 1; });
      return;
    }
    let len = 0; try { len = el.getTotalLength(); } catch(e) {}
    const fill = el.getAttribute("fill"); const hasFill = fill && fill !== "none" && fill !== "transparent";
    const fo = el.getAttribute("fill-opacity") || "1";
    el.style.transition = "none";
    if (len > 0 && el.getAttribute("stroke")) { el.style.strokeDasharray = len; el.style.strokeDashoffset = len; }
    if (hasFill) el.style.fillOpacity = 0;
    el.getBoundingClientRect();
    requestAnimationFrame(() => {
      el.style.transition = `stroke-dashoffset 1.1s ease ${delay}s, fill-opacity .6s ease ${delay + .8}s`;
      el.style.strokeDashoffset = 0; if (hasFill) el.style.fillOpacity = fo;
    });
  });
}
function revealNext(){
  if (shown >= groups.length) return;
  drawGroup(groups[shown]);
  $("caption").textContent = (groups.length > 1 ? `${t().step} ${shown + 1}: ` : "") + (groups[shown].dataset.caption || "");
  shown++; updateCtrls();
}
function playSteps(){
  groups.forEach(g => g.style.display = "none"); shown = 0;
  const go = () => { if (shown < groups.length) { revealNext(); setTimeout(go, 1600); } }; go();
}
// "What these mean": every symbol on the steps drawn so far (tap one to hear it)
function renderLegend(){
  const seen = new Map(), fx = new Map();
  groups.slice(0, shown).forEach(g => {
    (g._legend || []).forEach(l => { if (!seen.has(l.symbol)) seen.set(l.symbol, l.meaning); });
    (g._formulas || []).forEach(f => { if (!fx.has(f.formula)) fx.set(f.formula, f.explanation); });
  });
  const box = $("legend"); box.innerHTML = "";
  if (!seen.size && !fx.size) { box.classList.add("hide"); return; }
  if (seen.size) {
    const tt = document.createElement("div"); tt.className = "lt"; tt.textContent = t().legend; box.appendChild(tt);
    seen.forEach((meaning, symbol) => {
      const b = document.createElement("button"); const s = document.createElement("b"); s.textContent = symbol;
      b.appendChild(s); b.appendChild(document.createTextNode(meaning));
      b.onclick = () => { if (!speaking) sayShort(meaning); };
      box.appendChild(b);
    });
  }
  if (fx.size) {
    const tt = document.createElement("div"); tt.className = "lt"; tt.textContent = t().mathWorks; box.appendChild(tt);
    fx.forEach((explanation, formula) => {
      const b = document.createElement("button"); b.className = "fxb"; const s = document.createElement("b"); s.textContent = formula;
      b.appendChild(s); b.appendChild(document.createTextNode(explanation));
      b.onclick = () => { if (!speaking) sayShort(explanation); };
      box.appendChild(b);
    });
  }
  box.classList.remove("hide");
}
function updateCtrls(){
  renderLegend();
  $("prev").disabled = shown <= 1; $("next").disabled = shown >= groups.length; $("replay").disabled = groups.length === 0;
}
$("next").onclick = () => { manual = true; revealNext(); };
$("prev").onclick = () => {
  manual = true; if (shown <= 1) return;
  shown--; groups[shown].style.display = "none";
  $("caption").textContent = (groups.length > 1 ? `${t().step} ${shown}: ` : "") + (groups[shown - 1].dataset.caption || "");
  updateCtrls();
};
$("replay").onclick = () => { manual = true; playSteps(); };
function onProgress(f){
  lastProgress = Math.max(lastProgress, f);
  if (manual) return;
  while (shown < groups.length && f >= boardStart + (1 - boardStart) * shown / groups.length) revealNext();
}

/* ---------- voice + read-along ---------- */
function highlight(ci){
  let k = -1;
  for (let i = 0; i < words.length; i++) { if (words[i].start <= ci) k = i; else break; }
  words.forEach((w, i) => { w.el.classList.toggle("on", i === k); w.el.classList.toggle("done", i < k); });
}
function clearHighlight(){ words.forEach(w => w.el.classList.remove("on","done")); $("read").classList.remove("speaking"); }
function setSpeaking(on){ speaking = on; $("read").classList.toggle("speaking", on); $("stop").classList.toggle("hide", !on); $("again").classList.toggle("hide", on); }
function finish(){ setSpeaking(false); words.forEach(w => { w.el.classList.remove("on"); w.el.classList.add("done"); }); onProgress(1); }
function stopVoice(){
  cancelAnimationFrame(raf);
  try { if (srcNode) { srcNode.onended = null; srcNode.stop(); } } catch(e) {}
  srcNode = null;
  try { speechSynthesis.cancel(); } catch(e) {}
  if (speaking) { setSpeaking(false); clearHighlight(); }
}
$("stop").onclick = () => { stopVoice(); onProgress(1); };
$("again").onclick = () => { unlock(); if (lastAudio) playBuffer(lastAudio); else speak(); };

async function speak(){
  if (!speech) return;
  lastAudio = null; lastProgress = 0;
  if (!voiceOff && voicePref === "man") {
    try {
      const r = await fetch("/api/speak", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ text: speech }) });
      if (r.status === 501) voiceOff = true;
      else if (r.ok) {
        const d = await r.json();
        const bytes = Uint8Array.from(atob(d.audio), c => c.charCodeAt(0));
        const buf = await ctx.decodeAudioData(bytes.buffer);
        const times = d.alignment && d.alignment.character_start_times_seconds;
        words.forEach(w => { w.t = times && times[w.start] != null ? times[w.start] : null; });
        lastAudio = { buf, timed: !!times };
        return playBuffer(lastAudio);
      }
    } catch(e) {}
  }
  browserVoice(speech);
}
function playBuffer(a){
  stopVoice();
  if (!ctx) return browserVoice(speech);
  srcNode = ctx.createBufferSource(); srcNode.buffer = a.buf; srcNode.connect(ctx.destination);
  const t0 = ctx.currentTime, dur = a.buf.duration;
  setSpeaking(true);
  srcNode.onended = () => { cancelAnimationFrame(raf); finish(); };
  srcNode.start();
  const tick = () => {
    const tm = ctx.currentTime - t0;
    if (a.timed) { let k = -1; for (let i = 0; i < words.length; i++) { if (words[i].t != null && words[i].t <= tm) k = i; } if (k >= 0) highlight(words[k].start); }
    else highlight(Math.floor(speech.length * tm / dur));
    onProgress(tm / dur);
    raf = requestAnimationFrame(tick);
  };
  tick();
}

let voicePref = "man";
try { if (localStorage.getItem("mpc_voice") === "woman") voicePref = "woman"; } catch(e) {}
function setVoicePref(p){
  voicePref = p;
  $("vMan").classList.toggle("on", p === "man"); $("vWoman").classList.toggle("on", p === "woman");
  try { localStorage.setItem("mpc_voice", p); } catch(e) {}
}
$("vMan").onclick = () => { setVoicePref("man"); unlock(); sayShort(t().hello); };
$("vWoman").onclick = () => { setVoicePref("woman"); unlock(); sayShort(t().hello); };

function pickVoice(){
  const want = lang === "es" ? /^es(-|_)/i : /^en(-|_)US/i;
  const vs = speechSynthesis.getVoices().filter(v => want.test(v.lang));
  const male = /\bmale\b|andrew|brian|christopher|eric|guy|roger|steffan|aaron|evan|tom|nathan|alex|daniel|david|mark|fred|jorge|diego|pablo|juan|carlos|alvaro|raul|enrique|tomas|gerardo|jose/i;
  const female = /female|aria|jenny|ava|emma|michelle|ana\b|samantha|zira|allison|susan|joanna|nicky|google us english|paulina|monica|helena|laura|dalia|elvira|ximena|sabina|lucia|francisca|conchita|marisol|google español/i;
  const fits = voicePref === "woman" ? (v => female.test(v.name)) : (v => male.test(v.name) && !female.test(v.name));
  const natural = vs.filter(v => /natural|online|enhanced|premium/i.test(v.name));
  return natural.find(fits) || vs.find(fits) || natural[0] || vs[0] || null;
}
function browserVoice(text){
  if (!("speechSynthesis" in window)) { onProgress(1); return; }
  stopVoice();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(); if (v) u.voice = v;
  u.lang = lang === "es" ? "es-US" : "en-US";
  u.rate = level === "little" ? 0.95 : 1.03; u.pitch = 1.12;
  u.onstart = () => { setSpeaking(true); onProgress(0); };
  u.onboundary = e => { highlight(e.charIndex); onProgress(e.charIndex / text.length); };
  u.onend = finish;
  speechSynthesis.speak(u);
  setTimeout(() => { if (!speaking) onProgress(1); }, 2500);
}
function sayShort(text){
  if (!("speechSynthesis" in window) || !text) return;
  const u = new SpeechSynthesisUtterance(text); const v = pickVoice(); if (v) u.voice = v;
  u.lang = lang === "es" ? "es-US" : "en-US"; u.rate = 1; u.pitch = 1.12;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};

/* ---------- picture ---------- */
async function loadImage(q){
  try {
    const r = await fetch("/api/images?q=" + encodeURIComponent(q));
    const d = await r.json();
    if (!d.image) return;
    const img = $("img");
    img.onload = () => { $("imgCard").classList.remove("hide"); $("extras").classList.remove("hide"); };
    img.onerror = () => $("imgCard").classList.add("hide");
    img.alt = d.image.title || q;
    img.src = d.image.src;
    $("credit").textContent = `${d.image.title ? d.image.title + " · " : ""}Credit: ${d.image.credit} · ${d.image.license} · ${d.image.source}`;
  } catch(e) {}
}

/* ---------- quiz ---------- */
function buildQuiz(q){
  $("quizQ").textContent = q.question; $("fb").textContent = "";
  const box = $("opts"); box.innerHTML = ""; let done = false;
  const opts = q.options.slice(0, 3);
  $("answerKey").textContent = t().answerKey + (opts[q.answer] || "");
  opts.forEach((o, i) => {
    const b = document.createElement("button"); b.className = "opt"; b.textContent = o;
    b.onclick = () => {
      if (done) return;
      if (i === q.answer) { done = true; b.classList.add("right"); $("fb").textContent = t().gotIt + (q.why || ""); sayShort(t().gotIt.replace("🎉", "") + (q.why || "")); }
      else { b.classList.add("wrong"); $("fb").textContent = t().goodTry; sayShort(t().goodTry); }
    };
    box.appendChild(b);
  });
  $("quizCard").classList.remove("hide");
}

/* ---------- auto-size: tell the host page how tall this tool is ---------- */
(function(){
  let last = 0;
  function send(){
    const w = document.querySelector(".wrap"); if (!w) return;
    const h = Math.ceil(w.getBoundingClientRect().bottom + window.scrollY + 12);
    if (Math.abs(h - last) < 4) return;
    last = h;
    try { if (window.parent !== window) window.parent.postMessage({ type: "pp-frame-height", h: h }, "*"); } catch(e) {}
  }
  try { new ResizeObserver(send).observe(document.body); } catch(e) {}
  window.addEventListener("load", send);
  setInterval(send, 1500);
  send();
})();
})();
