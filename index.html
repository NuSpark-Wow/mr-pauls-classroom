<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr. Paul's Classroom</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf8ef; --ink:#24292f; --soft:#57606a; --blue:#1f6feb; --blue-d:#1a5fd0; --orange:#f0a020;
  --green:#2da44e; --red:#e5534b; --purple:#8250df; --yellow:#ffd33d; --card:#ffffff; --line:#e7dfd0;
  --bezel:#33475b; --radius:20px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 28px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{font-weight:900;font-size:clamp(22px,3vw,30px);letter-spacing:-.3px}
.brand span{color:var(--blue)}
.levels{display:flex;background:#efe6d6;border-radius:999px;padding:5px;gap:4px}
.levels button{border:0;background:transparent;padding:10px 18px;border-radius:999px;font-weight:800;font-size:16px;color:var(--soft)}
.levels button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.levels small{display:block;font-size:12px;font-weight:700;opacity:.75}
.top-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.voices button{padding:10px 14px;font-size:15px}

/* ask bar */
.ask{background:var(--card);border-radius:var(--radius);padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 16px rgba(80,60,20,.08)}
.mic{flex:none;width:72px;height:72px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:32px;box-shadow:0 4px 0 #b83c35;transition:transform .1s}
.mic:active{transform:translateY(3px);box-shadow:0 1px 0 #b83c35}
.mic.listening{animation:pulse 1.1s infinite}
.mic.cam{background:#2a7de1;box-shadow:0 4px 0 #1d5fb0}
.mic.cam:active{box-shadow:0 1px 0 #1d5fb0}
.photo{display:flex;align-items:center;gap:10px;margin-top:8px}
.photo img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:3px solid var(--line)}
.photo button{border:0;background:var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;font-size:14px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,83,75,.55)}100%{box-shadow:0 0 0 22px rgba(229,83,75,0)}}
.field{flex:1;min-width:0}
.field input{width:100%;border:3px solid var(--line);border-radius:14px;padding:14px 16px;font-size:20px;font-family:inherit;font-weight:700;color:var(--ink);outline:none}
.field input:focus{border-color:var(--blue)}
.hint{font-size:14px;color:var(--soft);margin-top:6px;font-weight:700;min-height:19px}
.go{flex:none;border:0;background:var(--blue);color:#fff;font-weight:900;font-size:20px;padding:0 26px;height:60px;border-radius:16px;box-shadow:0 4px 0 #154aa8}
.go:disabled{opacity:.5}
.go.ready{animation:glow 1s infinite alternate}
@keyframes glow{to{background:#4b8df5}}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 2px 16px}
/* three paths, subjects, view switch, help buttons, practice, parent note */
.paths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 12px}
.paths button{border:3px solid var(--line);background:var(--card);border-radius:18px;padding:12px 10px;text-align:center;font-family:inherit;color:var(--ink);box-shadow:0 3px 0 rgba(80,60,20,.08)}
.paths button b{display:block;font-size:18px;font-weight:900;margin-top:2px}
.paths button small{display:block;font-size:13px;color:var(--soft);font-weight:700;margin-top:2px}
.paths button .pi{font-size:28px;line-height:1}
.paths button.on{border-color:var(--blue);background:#eef4ff}
@media (max-width:560px){.paths button b{font-size:15px}.paths button small{font-size:12px}.paths button .pi{font-size:24px}}
.subjects{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 2px 12px}
.subjects .sl{font-weight:800;color:var(--soft);font-size:14px;margin-right:4px}
.chip.on{border-color:var(--blue);background:var(--blue);color:#fff}
.mic.cam.pulse{animation:camPulse 1.6s ease-in-out infinite}
@keyframes camPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.study{margin:0 0 14px}
.study .sl{font-weight:900;color:var(--soft);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:6px 0 8px}
.study .row2{display:flex;flex-wrap:wrap;gap:8px}
.study .views .chip{font-size:16px;padding:10px 16px}
.study .chip.on{background:var(--blue)!important;border-color:var(--blue)!important;color:#fff!important}
@media (max-width:640px){.study .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.study .row2 .chip{text-align:left;padding:10px 12px;font-size:15px}}
.checkbox{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.checkbox textarea{flex:1 1 260px;min-height:70px;border:3px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;font-size:17px;font-weight:700;color:var(--ink)}
.checkfb{margin-top:8px;font-weight:800;font-size:17px;line-height:1.45}
.pq{border:2px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px}
.pq .pt{font-weight:800;font-size:18px;margin-bottom:8px}
.pq .pr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pq input{flex:1 1 140px;min-width:0;width:auto;box-sizing:border-box;border:3px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:18px;font-weight:800}
.pq .pf{margin-top:8px;font-weight:800}
.pq.right{border-color:var(--green);background:#f0fbf3}
.pscore{font-weight:900;color:var(--green);margin-top:4px}
.notebtn{margin-top:14px}
.note h4{margin:12px 0 6px;font-size:16px}
.note ul{margin:0 0 6px 18px;padding:0}
.note li{margin:3px 0}
@media print{body.print-note *{visibility:hidden}body.print-note #noteCard,body.print-note #noteCard *{visibility:visible}body.print-note #noteCard{position:absolute;left:0;top:0;width:100%;box-shadow:none}body.print-note #noteCard .noprint{display:none}}
.pathmsg{margin:0 2px 12px;font-weight:800;font-size:17px;color:var(--ink);line-height:1.4}
.paths{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.paths{grid-template-columns:repeat(2,minmax(0,1fr))}}
.drill{background:var(--card);border-radius:var(--radius);padding:14px;margin:0 0 12px;box-shadow:0 4px 16px rgba(80,60,20,.08)}
.drill .trail{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:900;font-size:16px;margin-bottom:10px}
.drill .trail .sep{color:var(--soft)}
.drill .dl{font-weight:800;color:var(--soft);font-size:14px;margin:0 0 8px}
.drill .dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:900px){.drill .dgrid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.drill .dgrid button{border:2px solid var(--line);background:#fffdf8;border-radius:14px;padding:12px 10px;font:inherit;font-weight:800;font-size:15px;color:var(--ink);text-align:left;min-height:52px}
.drill .dgrid button:hover{border-color:var(--blue)}
.drill .drow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tools{display:flex;gap:10px;flex:none}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px}
.tool span{font-size:12.5px;font-weight:800;color:var(--soft)}
.mic.upl{background:#8250df;box-shadow:0 4px 0 #5e3aa8}
.photo .fname{font-weight:800;font-size:15px}
.accnote{font-size:12.5px;color:var(--soft);font-weight:700;margin:6px 0 0}
.card .accnote{font-size:12.5px!important;line-height:1.4!important}
.another{border:0;background:none;color:var(--blue-d);font-weight:800;font-size:14px;padding:6px 0;cursor:pointer}
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.wgrid{grid-template-columns:1fr}}
.wgrid figure{margin:0}
.wgrid img{width:100%;height:auto;border-radius:12px;display:block;background:#f2ede3}
.wgrid figcaption{font-weight:800;font-size:15px;margin-top:6px}
.wgrid .credit{font-size:12px!important}
.test .tq{font-size:13px;font-weight:900;color:var(--soft);text-transform:uppercase;letter-spacing:.05em}
.test .tt{font-size:20px;font-weight:900;margin:6px 0 12px;line-height:1.35}
.test .topts{display:grid;gap:8px}
.test .topts button{border:3px solid var(--line);background:#fffdf8;border-radius:14px;padding:12px 14px;font:inherit;font-weight:800;font-size:17px;text-align:left;color:var(--ink)}
.test .topts button.right{border-color:var(--green);background:#f0fbf3}
.test .topts button.wrong{border-color:var(--red);background:#fff2f1}
.test .tfb{margin-top:10px;font-weight:800;font-size:16px;line-height:1.45}
.test .tbig{font-size:30px;font-weight:900;color:var(--green)}
.test ul{margin:8px 0 0 18px;padding:0}.test li{margin:6px 0;line-height:1.4}
.test .trow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
/* Teens: a calmer, grown-up look */
body.teen{--bg:#f3f5f8;--line:#dfe4eb;--bezel:#26303c}
body.teen .chip,body.teen .paths button{border-radius:12px}
body.teen .brand span{color:#3b6fd8}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px;color:var(--ink)}
.chip:hover{border-color:var(--blue);color:var(--blue)}

/* classroom */
.room{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.board-wrap{background:var(--bezel);border-radius:24px;padding:14px 14px 10px;box-shadow:0 8px 24px rgba(30,40,60,.25)}
.board{position:relative;background:#fff;border-radius:12px;overflow:hidden;aspect-ratio:8/5}
.board svg{width:100%;height:100%;display:block}
.board svg text{cursor:pointer}
.board svg text:hover{opacity:.7}
.thinking{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(255,255,255,.92);font-family:'Patrick Hand',cursive;font-size:clamp(24px,3.4vw,38px);color:var(--blue)}
.thinking.on{display:flex}
.dots span{display:inline-block;width:14px;height:14px;margin:0 5px;border-radius:50%;background:var(--orange);animation:bob .9s infinite}
.dots span:nth-child(2){animation-delay:.15s;background:var(--green)}.dots span:nth-child(3){animation-delay:.3s;background:var(--purple)}
@keyframes bob{50%{transform:translateY(-12px)}}
.tray{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px 2px;color:#fff}
.caption{font-family:'Patrick Hand',cursive;font-size:clamp(18px,2.2vw,24px);flex:1;min-width:0}
.ctrls{display:flex;gap:6px}
.ctrls button{border:0;background:rgba(255,255,255,.16);color:#fff;font-size:18px;font-weight:900;width:44px;height:40px;border-radius:10px}
.ctrls button:hover{background:rgba(255,255,255,.3)}
.ctrls button:disabled{opacity:.35}

.panel{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 4px 16px rgba(80,60,20,.08)}
.panel h2{margin:0 0 10px;font-size:clamp(22px,2.6vw,28px);font-weight:900;line-height:1.15}
.read p{font-size:clamp(19px,2vw,22px);line-height:1.55;margin:0 0 12px;font-weight:700}
.read .w{border-radius:6px;padding:0 2px;transition:background .12s,color .12s}
.read .w.done{color:var(--ink)}
.read .w.on{background:var(--yellow);color:#000}
.read.speaking .w:not(.done):not(.on){color:#9aa3ad}
.playrow{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:900;font-size:16px;background:#eef3fb;color:var(--blue-d)}
.btn:hover{background:#dde8fa}
.vocab{margin-top:14px;border-top:2px dashed var(--line);padding-top:12px}
.vocab div{margin:6px 0;font-size:17px;font-weight:700}
.vocab b{color:var(--purple)}

.extras{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px;margin-top:16px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 4px 16px rgba(80,60,20,.08)}
.card h3{margin:0 0 8px;font-size:19px;font-weight:900}
.card p{margin:0;font-size:17px;line-height:1.5;font-weight:700}
.img-card img{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:#f4efe6;display:block}
.credit{font-size:12.5px !important;color:var(--soft);margin-top:8px !important;font-weight:700 !important}
.wow{background:#fff7d6}.wow h3{color:#b07800}
.tryit{background:#e8f6ec}.tryit h3{color:var(--green)}

.quiz{margin-top:16px}
.quiz .q{font-size:clamp(20px,2.2vw,24px);font-weight:900;margin-bottom:12px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{border:3px solid var(--line);background:#fff;border-radius:16px;padding:16px 12px;font-weight:800;font-size:18px;color:var(--ink);min-height:64px}
.opt:hover{border-color:var(--blue)}
.opt.right{border-color:var(--green);background:#e8f6ec}
.opt.wrong{border-color:var(--red);background:#fdeceb;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{margin-top:12px;font-size:18px;font-weight:800;min-height:24px}

.deeper{margin-top:16px}
.deeper .row{display:flex;flex-wrap:wrap;gap:10px}
.big-btns{display:flex;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.bigbtn{border:0;border-radius:16px;padding:16px 22px;font-weight:900;font-size:19px;color:#fff;flex:1;min-width:200px}
.bigbtn.ask-about{background:var(--red);box-shadow:0 4px 0 #b83c35}
.bigbtn.more{background:var(--green);box-shadow:0 4px 0 #1f7a38}
.bigbtn:active{transform:translateY(3px)}
.deeper .sub{font-size:15px;font-weight:800;color:var(--soft);margin-bottom:8px}
.deeper .chip{font-size:16px;padding:10px 16px;background:#f3eefe;border-color:#e2d6fb;color:#5b3ab0}
.bigbtn.on{outline:4px solid var(--yellow);outline-offset:2px}
.follow{background:#f6f9ff;border:2px solid #cfe0ff;border-radius:16px;padding:14px;margin:0 0 10px}
.follow .fl{font-weight:900;font-size:18px;margin-bottom:10px;color:var(--ink)}
.follow .frow{display:flex;gap:10px;align-items:center}
.follow .fmic{flex:none;width:54px;height:54px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:24px;box-shadow:0 3px 0 #b83c35}
.follow .fmic.listening{background:var(--green);box-shadow:0 3px 0 #1f7a38}
.follow input{flex:1;min-width:0;height:54px;border:3px solid var(--line);border-radius:14px;padding:0 14px;font-size:18px;font-family:inherit;font-weight:700;color:var(--ink);background:#fff}
.follow input:focus{outline:none;border-color:var(--blue)}
.follow .fgo{flex:none;border:0;background:var(--blue);color:#fff;font-weight:900;font-size:18px;padding:0 20px;height:54px;border-radius:14px;box-shadow:0 3px 0 #154aa8}
.follow .fgo:disabled{opacity:.75}
.fstatus{font-weight:800;font-size:17px;color:var(--blue);min-height:24px;margin:0 0 10px}
.fstatus:empty{display:none}
@media (max-width:560px){.follow .frow{flex-wrap:wrap}.follow input{flex-basis:calc(100% - 64px)}.follow .fgo{flex:1 1 100%}}

.notice{margin-top:18px;font-size:13.5px;color:var(--soft);line-height:1.5;text-align:center;font-weight:700}
.hide{display:none !important}
.pfig-grid{display:none}

@media (max-width:900px){
  .room{grid-template-columns:1fr}
  .extras{grid-template-columns:1fr}
}
@media (max-width:560px){
  .ask{flex-wrap:wrap}
  .mic{width:56px;height:56px;font-size:24px}
  .tools{width:100%;justify-content:center;gap:18px}
  .field{flex-basis:100%;order:3}
  .go{order:4}
  .go{width:100%;height:54px}
  .opts{grid-template-columns:1fr}
  .levels button{padding:8px 12px;font-size:14px}
}
.small-btn{border:0;background:#efe6d6;border-radius:999px;padding:10px 14px;font-weight:800;font-size:15px;color:var(--ink)}
.small-btn:hover{background:#e6dac4}
.small-btn.on{background:var(--ink);color:#fff}
.lang button{padding:10px 12px;font-size:15px}
.thumbs{display:flex;align-items:center;gap:6px;margin-left:auto;font-weight:800;font-size:14px;color:var(--soft)}
.thumbs button{border:0;background:#f3efe6;border-radius:10px;padding:8px 10px;font-size:18px}
.thumbs button:hover{background:#e9e2d2}
.print-only{display:none}
/* Study bar under the chalkboard: Pause, Continue, Explain this picture */
.studybar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 4px 2px}
.studybar button{min-height:50px;border-radius:12px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;font-weight:800;font-size:17px;line-height:1.15;padding:6px 8px}
.studybar button:disabled{opacity:.38}
.studybar button.on:disabled{opacity:1}
.studybar button small{display:block;font-size:12px;font-weight:600;margin-top:2px}
.studybar button.on{background:#ffe08a;border-color:#ffe08a;color:#2a2a1e}
.studybar #bCont.ready{animation:readyGlow 1.6s ease-in-out infinite;border-color:#a3e635;color:#a3e635;opacity:1}
.studybar #bCont.ready.on{color:#2a2a1e}
@media (max-width:560px){.studybar button{font-size:14px;min-height:54px}}
.explain{margin:8px 4px 2px;padding:12px 14px;border-top:1px dashed rgba(255,255,255,.3);color:#fff;font-size:17px;line-height:1.5}
.explain .lt{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:#cfe0ff;font-weight:700;margin:4px 0 6px}
.explain .ov{margin:0 0 10px;font-style:italic}
.explain .it{margin:0 0 10px}
.explain .it b{font-family:'Patrick Hand',cursive;font-size:23px;color:#ffd33d;margin-right:6px}
.explain .why{display:block;color:#a8f0b0;margin-top:2px}
.explain .wait{color:#cfe0ff;font-style:italic}
.explain .hidebtn{border:1px solid rgba(255,255,255,.35);background:none;color:#f5f3ea;border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;margin-top:4px}

.legend{margin:8px 4px 2px;padding:10px 6px 2px;border-top:2px dashed rgba(255,255,255,.3);display:flex;flex-wrap:wrap;gap:8px;color:#fff}
.legend .lt{width:100%;font-size:13px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;color:#cfe0ff}
.legend button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:16px}
.legend button:hover{background:rgba(255,255,255,.26)}
.legend b{font-family:'Patrick Hand',cursive;font-size:22px;color:#ffd33d;margin-right:6px}
.legend .fxb{width:100%;text-align:left;border-radius:14px;line-height:1.4}

/* Classroom mode: big board for a whole class */
body.present .wrap{max-width:none;padding:12px 24px}
body.present .starters,body.present .notice{display:none}
body.present .room{grid-template-columns:2.4fr 1fr}
body.present .read p{font-size:clamp(22px,1.8vw,30px)}
body.present .panel h2{font-size:clamp(26px,2.4vw,36px)}
body.present .caption{font-size:clamp(22px,2vw,30px)}
@media (max-width:900px){ body.present .room{grid-template-columns:1fr} }

/* Printable recap */
@media print{
  @page{margin:14mm}
  body{background:#fff}
  .ask,.starters,.ctrls,.playrow,.deeper,.notice,.top-right,.thinking,.feedback,#vocabSpacer{display:none !important}
  .wrap{max-width:none;padding:0}
  .room{grid-template-columns:1fr}
  .board-wrap{box-shadow:none;background:#fff;border:3px solid #33475b;padding:8px}
  body.pfigs .board, body.pfigs .tray{display:none !important}
  .pfig-grid{display:grid !important;grid-template-columns:1fr 1fr;gap:10px}
  .pfig{break-inside:avoid}.pfig svg{width:100%;height:auto;border:2px solid #d0d7de;border-radius:8px;background:#fff}
  .pfig div{font-family:'Patrick Hand',cursive;font-size:15px;color:#24292f;margin-top:2px}
  .tray{color:#24292f}
  .legend{color:#24292f;border-top-color:#ccc}
  .legend button{background:#f3efe6;color:#24292f}
  .legend .lt{color:#57606a}
  .panel,.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .extras{grid-template-columns:1fr 1fr}

<body>
<div class="wrap">

  <div class="top">
    <div class="brand" id="brand">Mr. Paul's <span>Classroom</span></div>
    <div class="top-right">
      <button class="small-btn" id="present">🖥️ Classroom</button>
      <div class="levels lang" role="group" aria-label="Language">
        <button id="lnEn" class="on">EN</button>
        <button id="lnEs">ES</button>
      </div>
      <div class="levels voices" role="group" aria-label="Choose a voice">
        <button id="vMan" class="on">🔊 Man</button>
        <button id="vWoman">🔊 Woman</button>
        <button id="vMute" aria-label="Mute: no voice, read the words">🔇 Mute</button>
      </div>
      <div class="levels voices" role="group" aria-label="Start over">
        <button id="replayAll" title="Play this lesson again from the beginning" disabled>⏮ Replay</button>
        <button id="startOver" title="Stop and clear everything to ask a new question">✕ New question</button>
      </div>
      <div class="levels voices" role="group" aria-label="Voice speed" style="display:none">
        <button id="sSlow">🐢 Slower</button>
        <button id="sNormal" class="on">▶ Normal</button>
        <button id="sFast">🐇 Faster</button>
      </div>
      <div class="levels voices rategrp" role="group" aria-label="Voice speed slider"><span class="rl" aria-hidden="true">🐢</span><input type="range" id="rate" min="0.8" max="1.25" step="0.05" value="1" aria-label="Voice speed: slide left for slower, right for faster"><span class="rl" aria-hidden="true">🐇</span><button id="rateVal" title="Tap to go back to normal speed">Normal</button></div>
      <div class="levels" role="group" aria-label="Choose your grade">
        <button id="lvLittle" class="on"></button>
        <button id="lvBig"></button>
        <button id="lvTeen"></button>
      </div>
    </div>
  </div>

  <div class="paths" id="paths" role="group" aria-label="Choose how to learn">
    <button data-mode="curious" class="on"><span class="pi">🤔</span><b id="pCur"></b><small id="pCurS"></small></button>
    <button data-mode="skill"><span class="pi">📘</span><b id="pSkill"></b><small id="pSkillS"></small></button>
    <button data-mode="work"><span class="pi">📸</span><b id="pWork"></b><small id="pWorkS"></small></button>
    <button data-mode="why"><span class="pi">🌎</span><b id="pWhy"></b><small id="pWhyS"></small></button>
  </div>
  <p class="pathmsg" id="pathMsg"></p>
  <div class="subjects hide" id="subjects"></div>
  <div class="drill hide" id="drill"></div>
  <div class="ask">
    <div class="tools">
      <div class="tool"><button class="mic" id="mic" aria-label="Talk to Mr. Paul">🎤</button><span id="tTalk"></span></div>
      <div class="tool"><button class="mic cam" id="cam" aria-label="Snap a photo">📷</button><span id="tSnap"></span></div>
      <div class="tool"><button class="mic upl" id="upl" aria-label="Upload a file">📎</button><span id="tUpload"></span></div>
    </div>
    <input type="file" id="camFile" accept="image/*" capture="environment" hidden>
    <input type="file" id="uplFile" accept="image/*,.pdf,application/pdf,.docx,.txt,text/plain" hidden>
    <div class="field">
      <input id="q" maxlength="200" autocomplete="off">
      <div class="hint" id="hint"></div>
      <div class="photo hide" id="photoBox"><img id="photoImg" alt=""><span class="fname hide" id="fileName"></span><button id="photoX"></button></div>
    </div>
    <button class="go" id="go"></button>
  </div>
  <div class="starters" id="starters"></div>

  <div class="room">
    <div class="board-wrap">
      <div class="board">
        <svg id="svg" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-label="Mr. Paul's smart board"></svg>
        <div class="thinking" id="thinking"><div id="thinkText"></div><div class="dots"><span></span><span></span><span></span></div></div>
      </div>
      <div class="tray">
        <div class="caption" id="caption"></div>
        <div class="ctrls">
          <button id="prev" aria-label="Back one step" disabled>◀</button>
          <button id="next" aria-label="Next step" disabled>▶</button>
          <button id="replay" aria-label="Draw it again" disabled>⟲</button>
        </div>
      </div>
      <div class="studybar" id="studybar">
        <button id="bPause" disabled>⏸ Pause</button>
        <button id="bCont" disabled>▶ Continue</button>
        <button id="bExplain" disabled>📖 Explain this picture</button>
      </div>
      <div class="legend hide" id="legend"></div>
      <div class="explain hide" id="explain" aria-live="polite"></div>
    </div>

    <div class="panel hide" id="panel">
      <h2 id="title"></h2>
      <div class="read" id="read"></div>
      <div class="playrow hide" id="playrow">
        <button class="btn" id="again"></button>
        <button class="btn hide" id="pause">⏸ Pause</button>
        <button class="btn hide" id="stop"></button>
        <button class="btn" id="print"></button>
        <div class="thumbs" id="thumbs"><span id="helpful"></span><button id="up" aria-label="Yes">👍</button><button id="down" aria-label="No">👎</button></div>
      </div>
      <div class="vocab hide" id="vocab"></div>
    </div>
  </div>

  <div class="extras hide" id="extras">
    <div class="card img-card hide" id="imgCard">
      <h3 id="hImg"></h3>
      <img id="img" alt="">
      <p class="credit" id="credit"></p>
      <p class="accnote" id="imgNote"></p>
      <button class="another" id="imgAnother"></button>
    </div>
    <div class="card why-photos hide" id="whyCard" style="grid-column:1/-1"><h3 id="hWhyPhotos"></h3><div class="wgrid" id="wGrid"></div><p class="accnote" id="wNote"></p></div>
    <div class="card wow hide" id="wowCard"><h3 id="hWow"></h3><p id="wow"></p></div>
    <div class="card tryit hide" id="tryCard"><h3 id="hTry"></h3><p id="try"></p></div>
  </div>

  <div class="card quiz hide" id="quizCard">
    <h3 id="hQuiz"></h3>
    <div class="q" id="quizQ"></div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="fb"></div>
    <p class="print-only" id="answerKey" style="font-size:13px;color:#57606a;margin-top:10px"></p>
  </div>

  <div class="card practice hide" id="practiceCard">
    <h3 id="hPrac"></h3>
    <div id="pList"></div>
    <div class="pscore" id="pScore"></div>
  </div>

  <div class="card test hide" id="testCard" aria-live="polite"></div>

  <div class="card deeper hide" id="deepCard">
    <div class="study">
      <div class="sl" id="viewsLabel"></div>
      <div class="row2 views" id="views">
        <button class="chip" data-a="idea" id="vIdea"></button>
        <button class="chip" data-a="real" id="vReal"></button>
        <button class="chip" data-a="home" id="vHome"></button>
      </div>
      <div class="sl" id="helpsLabel"></div>
      <div class="row2" id="helps">
        <button class="chip" data-a="another" id="hAnother"></button>
        <button class="chip" data-a="walk" id="hWalk"></button>
        <button class="chip" data-a="hint" id="hHint"></button>
        <button class="chip" data-a="practice" id="hPractice"></button>
        <button class="chip" data-a="test" id="hTest"></button>
        <button class="chip" data-a="check" id="hCheck"></button>
      </div>
      <div class="checkbox hide" id="checkBox"><textarea id="checkText"></textarea><button class="btn" id="checkGo"></button></div>
      <div class="checkfb" id="checkFb" aria-live="polite"></div>
    </div>
    <h3 id="hDeep"></h3>
    <div class="big-btns">
      <button class="bigbtn ask-about" id="askAbout"></button>
      <button class="bigbtn more" id="tellMore"></button>
    </div>
    <div class="follow hide" id="followBox">
      <div class="fl" id="fLabel"></div>
      <div class="frow"><button class="fmic" id="fMic" aria-label="Talk">🎤</button><input id="fq" autocomplete="off"><button class="fgo" id="fGo"></button></div>
    </div>
    <div class="fstatus" id="fStatus" aria-live="polite"></div>
    <div class="sub" id="orTry"></div>
    <div class="row" id="deeper"></div>
  </div>

  <button class="btn notebtn hide" id="noteBtn"></button>
  <div class="card note hide" id="noteCard" aria-live="polite"></div>

  <p class="notice" id="notice"></p>
</div>

// Reads the drawing as it streams in: one finished step per line, drawn right away.

  else r = await fetch("/api/ask", { method:"POST", headers:{ "content-type":"application/json" },
    body: JSON.stringify({ part: "board", question, level, lang, context: context || opts.boardTitle || "", more: !!opts.more, prev: opts.prev || "", a }) });
  if (!r.ok) throw new Error("H" + r.status);
  let n = 0, buf = "";

    if (!line.trim()) return;
    let o; try { o = JSON.parse(line); } catch(e) { return; }
    if (Array.isArray(o.steps)) o.steps.forEach(s => { n++; onStep(s); });
    else if (o.svg !== undefined) { n++; onStep(o); }

  m = v.match(/^-?\d+(?:\.\d+)?/); if (m) return parseFloat(m[0]);   // "12 apples" -> 12

}

/* ---------- picture ---------- */
async function loadImage(q){
  try {
    const r = await fetch("/api/images?q=" + encodeURIComponent(q));
    const d = await r.json();
    if (!d.image) return;
    const img = $("img");
    img.onload = () => { $("imgCard").classList.remove("hide"); $("extras").classList.remove("hide"); };
    img.onerror = () => $("imgCard").classList.add("hide");
    img.alt = d.image.title || q;
    img.src = d.image.src; mainQ = q; mainSeen = [d.image.src];
    $("credit").textContent = `${d.image.title ? d.image.title + " · " : ""}Credit: ${d.image.credit} · ${d.image.license} · ${d.image.source}`;
  } catch(e) {}
}

/* ---------- quiz ---------- */
function buildQuiz(q){
  $("quizQ").textContent = q.question; $("fb").textContent = "";
  const box = $("opts"); box.innerHTML = ""; let done = false;
  const opts = q.options.slice(0, 3);
  $("answerKey").textContent = t().answerKey + (opts[q.answer] || "");
  opts.forEach((o, i) => {
    const b = document.createElement("button"); b.className = "opt"; b.textContent = o;
    b.onclick = () => {
      if (done) return;
      if (i === q.answer) { done = true; b.classList.add("right"); $("fb").textContent = t().gotIt + (q.why || ""); sayShort(t().gotIt.replace("🎉", "") + (q.why || "")); }
      else { b.classList.add("wrong"); $("fb").textContent = t().goodTry; sayShort(t().goodTry); }
    };
    box.appendChild(b);
  });
  $("quizCard").classList.remove("hide");
}

/* ---------- auto-size: tell the host page how tall this tool is ---------- */
(function(){
  let last = 0;
  function send(){
    const w = document.querySelector(".wrap"); if (!w) return;
    const h = Math.ceil(w.getBoundingClientRect().bottom + window.scrollY + 12);
    if (Math.abs(h - last) < 4) return;
    last = h;
    try { if (window.parent !== window) window.parent.postMessage({ type: "pp-frame-height", h: h }, "*"); } catch(e) {}
  }
  try { new ResizeObserver(send).observe(document.body); } catch(e) {}
  window.addEventListener("load", send);
  setInterval(send, 1500);
  send();
})();
})();

// Start over: stops everything and clears the topic, so the visitor can ask something new (or pick another tool)
(function(){ const b = document.getElementById("startOver"); if (!b) return;
  b.onclick = () => {
    try { speechSynthesis.cancel(); } catch(e) {}
    try { if (typeof ctx !== "undefined" && ctx) ctx.close(); } catch(e) {}
    location.replace(location.pathname);   // a fresh page, without any shared-link question
  };
})();
